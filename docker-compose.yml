networks:
  pos_internal:
    driver: bridge
  shared_network:
    external: true

services:

  # ─── PHP-FPM (Laravel 13 + Inertia SSR) ────────────────────────────────────
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: pos_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - PHP_OPCACHE_ENABLE=0
    networks:
      - pos_internal     # komunikasi dengan Nginx
      - shared_network    # akses ke shared_mysql

  # ─── Nginx ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: pos_nginx
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - pos_internal

  # ─── Node.js (Vite Dev Server - HMR) ───────────────────────────────────────
  # Hanya untuk LOCAL DEVELOPMENT. Di production, asset di-build sekali lewat
  # "npm run build" dan disajikan langsung oleh Nginx sebagai static file.
  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: pos_node
    restart: unless-stopped
    ports:
      - "5174:5174"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - pos_internal
    environment:
      - NODE_ENV=development